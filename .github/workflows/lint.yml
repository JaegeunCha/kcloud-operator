# lint.yml: push·PR 시 golangci-lint 와 docs 경로 인용 실재 게이트를 돈다.
# 상세: CRD embed 번들을 먼저 만들어야 golangci-lint 타입체크가 fresh clone 에서도 통과한다.
# 생성일: 2025-07-04 | 수정일: 2026-11-16
name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/crdapply/crd/*.yaml is a generated (gitignored) embed bundle.
      # Populate it from the committed config/crd/bases so `//go:embed crd/*.yaml`
      # has matching files; otherwise golangci-lint typecheck fails on a fresh clone.
      - name: Generate CRD embed bundle
        run: make embed-crds

      # 주석·values·워크플로가 가리키는 docs/*.md 가 이 트리에 없으면 실패한다. 이 라인은
      # 기본 라인의 docs 를 들고 있지 않아, 기본 라인 문서를 가리키는 주석이 쉽게 생긴다.
      - name: Doc citation existence gate
        run: make doc-cite-check

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
