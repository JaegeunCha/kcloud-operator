# ============================================================
# values-dev.example.yaml: 개발 클러스터 오버라이드 예시 — 복사해 values-dev.yaml 로 두면 install.sh 가 병합한다(그 파일은 커밋하지 않는다)
# 상세: install.sh 가 존재 시 자동으로 -f 로 적용한다(dev 배포 경로 한정). 차트 기본값(values.yaml)은
#       외부 소비자용으로 유지하고, 이 클러스터에만 필요한 설정을 여기서 영속시킨다.
# 생성일: 2026-07-16 | 수정일: 2026-11-16
# ============================================================
driverInstallPolicies:
  nvidia:
    driver:
      # host-install 전환 이미지(v176). Dockerfile.v17 에 INSTALL_METHOD=hostnamespace
      # 기본값이 박혀 entrypoint-v17.sh 가 v16 entrypoint.sh 로 위임 → driver userspace 까지
      # host 설치 + /dev 노드 보장 + 툴킷/런타임 설정 비활성(런타임=toolkit DS).
      # 차트 기본값 -v175(containerized 고아 경로)를 이 dev 클러스터에서 대체·영속.
      tag: "580.159.03-v179"
    toolkit:
      # nvidia-container-toolkit DS 상주 = containerd nvidia runtime 의 소유자.
      # driver 설치(Mode=job 포함)와 무관하게 항상 상주하여, drain/containerd 재구성 후에도
      # nvidia-ctk 로 runtime 을 idempotent 재등록한다(device-plugin runtimeClass=nvidia 보장).
      # --set 으로만 켜면 helm upgrade 한 번에 사라져 toolkit DS 가 없어지고, containerd 의
      # nvidia runtime 등록이 유실되어 GPU allocatable 이 0 이 되므로 커밋된 values 로 영속한다.
      enabled: true
      method: apt
      # 벤더 이미지지만 전체 경로 필드라 vendorRegistry 조립 대상이 아니다. 이 dev
      # 클러스터는 Harbor 미러 경로를 사이트 값 파일에서 덮어쓴다. 여기 기본값은
      # 미러가 없어도 뜨도록 upstream 경로를 둔다(nvcr.io 는 k8s/ 가 경로에 들어간다).
      image: "nvcr.io/nvidia/k8s/container-toolkit:v1.17.8-ubuntu20.04"

# 아래 3값은 values.yaml 기본값이 모두 false 라 --set 으로만 켜면 helm upgrade 한 번에 사라진다.
# furiosa.unified 가 false 로 돌아가면 통합 DS 가 분리 2-DS 로 되돌아가므로 이 클러스터는
# 통합 DS 를 유지하도록 여기 커밋해 영속시킨다.

# Furiosa 통합 device-plugin: Warboy+RNGD 를 단일 통합 DS 로 배포.
furiosa:
  unified:
    enabled: true

# Admission webhook: DIP/NCP validating + opt-in Pod mutating. 라이브 검증 상시 on.
webhook:
  enabled: true

# 관리 REST API: operator pod 내 HTTPS listener(:9444). 라이브 검증 상시 on.
api:
  enabled: true
